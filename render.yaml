services:
  - type: web
    name: kudladirect-web
    env: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  - type: web
    name: kudladirect-static
    env: static
    plan: free
    region: singapore
    branch: main
    buildCommand: ""
    staticPublishPath: ./public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
